<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween-Effekte Test</title>
<style>
:root{--bg:#0e0914;--panel:#1a1226;--line:#3a2853;--fg:#f6f0ff;--mute:#bbaed0;--or:#ff7a1a;--vi:#a77bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:20px;max-width:1700px;margin:0 auto}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.left{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:12px}
@media(max-width:1000px){.left{position:static}}
.stage{background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.stage iframe{width:100%;height:100%;border:0;display:block}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 6px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,a.btn{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--or)}
button.pri{background:var(--or);color:#1c0a00;border-color:var(--or);font-weight:700}
button.stop{border-color:#c0392b}
.now{min-height:28px;color:var(--or);font-weight:700}
.grp{margin:18px 0 6px;color:var(--vi);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row.act{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
.row b{display:block}
.row span{color:var(--mute);font-size:14px}
.row code{grid-column:1/-1;color:var(--mute);font-size:12px;word-break:break-all}
.row .go{align-self:center}
.note{color:var(--mute);font-size:13px}
</style></head><body>
<div class="wrap">
 <div class="left">
  <div><h1>Halloween-Effekte</h1><p class="sub">Jeden Effekt einzeln abspielen oder alles nacheinander ansehen.</p></div>
  <div class="stage"><iframe id="f" title="Vorschau"></iframe></div>
  <div class="bar">
   <button class="pri" id="all">▶ Alles nacheinander</button>
   <button class="stop" id="stop">■ Stopp</button>
   <button id="prev">◀ Folie</button><button id="next">Folie ▶</button>
   <select id="page"><option value="training">Training</option><option value="physio">Physio</option></select>
   <select id="day"><option value="">Heute</option><option value="22">Stand 22.10.</option><option value="27">Stand 27.10.</option><option value="28">Stand 28.10. (Countdown rot)</option><option value="31">Finale 31.10.</option></select>
  </div>
  <div class="now" id="now"></div>
  <p class="note">Die Folie bleibt hier stehen und die Zufallseffekte sind aus. Bei „Alles nacheinander“ springt die Vorschau von selbst zur passenden Folie (Foto-Folie, Folie mit Kopfzeile).</p>
 </div>
 <div id="list"></div>
</div>
<script>
// [id, Titel, Beschreibung, Folie die passt (0=Titel mit Foto, 1=Folie mit Kopfzeile), Gruppe]
var L=[
["Zufallseffekte (alle 15–30 s einer, immer nur einer gleichzeitig)"],
["lightning","Gewitter-Blitz","Weißer Blitz über den ganzen Bildschirm"],
["flicker","Flackern","Logo und Uhr flackern wie eine kaputte Neonröhre"],
["bats","Fledermaus-Schwarm","14 Fledermäuse fliegen quer durchs Bild"],
["eyes","Leuchtende Augen","Zwei Augenpaare blinzeln am Seitenrand"],
["spider","Spinne am Faden","Seilt sich von oben ab und klettert wieder hoch"],
["drip","Slime","Grüner Schleim tropft vom oberen Rand"], 
["fog","Nebel","Nebelschwaden ziehen unten durchs Bild"],
["shake","Geist stößt gegen die Folie","Geist am Rand, die Folie wackelt"],
["clock","Uhr 13:13","Uhr zeigt rot flackernd 13:13",1],
["xray","Röntgen-Scan","Scanner-Balken, das Teamfoto wird zum Röntgenbild",0],
["spine","Wirbelsäule","Logo-Punkte oben links werden zu Knochen",1],
["glitch","VHS-Glitch","Folie zuckt mit Farbversatz und Streifen"],
["boo","„Boo!“ an der Scheibe","Schriftzug wird wie auf eine beschlagene Scheibe geschrieben"],
["skel","Laufendes Skelett","Läuft unten durchs Bild und verliert einen Knochen"],
["moonwolf","Vollmond","Mond mit Fledermäusen und kahlem Baum hinter dem Inhalt"],
["graves","Grabsteine","Wachsen unten hoch, ein Geist schwebt dazwischen"],
["sparkle","Funkenspur","Gelbe und lila Funken ziehen in einer Welle über die Folie"],
["ravens","Raben","Schwarze Raben ziehen flatternd quer durchs Bild"],
["handprints","Blutige Handabdrücke","Eine Spur aus Handabdrücken kriecht am unteren Rand entlang"],
["wisps","Irrlichter","Grünlich leuchtende Lichter treiben langsam nach oben"],
["fireflies","Glühwürmchen","Kleine Lichter schweben langsam durchs Bild"], 
["upside","Kopfstand","Die Folie dreht sich 3 Sekunden um 180°"],
["flashlight","Taschenlampe","Bildschirm dunkel, nur ein Lichtkegel wandert über die Folie"],
["photobomb","Geister-Fotobomb","Durchsichtiger Geist taucht im Teamfoto auf",0],  
["cursedbar","Verfluchter Fortschrittsbalken","Der Balken unten zuckt, springt und färbt sich verflucht"],
["neg","Negativ-Blitz","Die Folie blitzt mehrfach als Negativ auf"],
["Folienwechsel (bei etwa der Hälfte aller Wechsel eins davon)"],
["tear","Krallen zerfetzen die Folie","Drei Schnitte, die alte Folie reißt in Streifen und fällt weg"],
["crumble","Folie zerbröselt","Alte Folie löst sich von unten nach oben in Asche und Glut auf"],
["roll","Rollender Kürbis","Kürbis rollt unten durchs Bild"],
["bleed","Blut tropft von der Überschrift","Zähe Tropfen, einer reißt ab und fällt",0],
["smoke","Rauch","Violette Rauchwolke blendet über"],
["Verwandlungen (nur Seite „Training“, im Betrieb zeitversetzt je Person)"],
["trans2","Verwandlung Trainingsfolie","Blitz, Alex, Elijah und Kilian werden zu Hexe/Geist/Dämon, Frankenstein/Vampir, Skelett/Zombie/Pose und zurück",2],
["trans3","Verwandlung Team-Folie","Blitz, Siggi, Alex, Elijah, Kilian und Roland verwandeln sich nacheinander",3],
["Jumpscares mit den Verwandlungsfiguren (nur Seite „Training“)"],
["sc_fig_alex","Alex als Figur","Freigestellte Figur (Hexe, Geist oder Dämon) springt groß ins Bild"],
["sc_fig_elijah","Elijah als Figur","Frankenstein oder Vampir springt ins Bild"],
["sc_fig_kilian","Kilian als Figur","Skelett oder Zombie springt ins Bild"],
["sc_fig_siggi","Siggi als Figur","Sensenmann, Werwolf oder Kürbiskönig springt ins Bild"],
["sc_fig_roland","Roland als Figur","Friedhofswärter, Kettensäge oder Poltergeist springt ins Bild"],
["Jumpscares (alle 2–4 Folien einer von 17)"],
["sc_ghost","Riesiger Geist","Weißer Blitz, der Geist mit roten Augen springt ins Bild"],
["sc_blackout","Blackout mit Augen","Bildschirm schwarz, zwei riesige rote Augen öffnen sich"],
["sc_glass","Gesicht an der Scheibe","Totenkopf knallt von innen gegen den Bildschirm, die Scheibe reißt"],
["sc_trap","Folie reißt auf","Die Folie springt auseinander, ein Schreckgespenst rast auf dich zu"],
["sc_hand","Hand schlägt zu","Riesige Zombie-Hand klatscht von innen gegen den Bildschirm, Glas reißt"],
["sc_stare","Augen überall","Bild wird dunkel, 16 Augenpaare starren dich an"],
["sc_mouth","Maul","Riesiges Maul rast auf dich zu und beißt zu"],
["sc_bats","Fledermaus-Explosion","46 Fledermäuse platzen aus der Mitte nach außen"],
["sc_spider","Spinne fällt herab","Riesige Spinne lässt sich in die Bildmitte fallen und klettert wieder hoch"],
["sc_crash","Falscher Absturz","Bunte Pixelbalken wie bei einem defekten Fernseher"],
["sc_photo","Besessene Gesichter","Alle Fotos werden grau, zoomen heran, schwarze Augenhöhlen glühen auf",0],
["sc_mirror","Folie spiegelt sich","Folie wird zum dunklen Spiegel, eine Gestalt tritt aus dem Hintergrund vor"],
["sc_clock","Uhr 3:33","Uhr springt auf 3:33, ein riesiger Schatten rast über den Bildschirm"],
["sc_headdrop","Kopf von oben","Ein Kopf klappt kopfüber von oben ins Bild und schreit"],
["sc_shadow","Riesiger Schatten","Schwarze Gestalt mit Klauen läuft in einem Satz über den Bildschirm"],
["sc_power","Stromausfall","Bild bricht zur Linie zusammen, im Schwarz taucht eine Spiegelung auf"],
["sc_peek","Geist späht rein","Geist schaut vom Rand, dann springt er vor"],
["Täglich mehr Grusel (wächst bis 31.10., nichts zum Abspielen)"],
["info1","Mehr Geister","Am Fernseher immer 6 Geister, am Computer 9 am Anfang und am 31.10. 22 – siehe ?hw=1&hwday=31"],
["info2","Mehr Spinnweben","Ecken verspinnen: ab 15.10. oben rechts, später unten links, unten rechts, Fäden am Oberrand – ?hw=1&hwday=31"],
["info3","Countdown pulsiert rot","Ab 28.10. pulsiert „Noch 3 Tage“ rot auf der Titelfolie – ?hw=1&hwday=28"],
["Nur am Finale (31.10.)"],
["rain","Kürbisregen","18 Kürbisse fallen über die Folie"]
];
(function(){var P=[['Alex',[['alex-hexe','Hexe'],['alex-geist','Geist'],['alex-daemon','Dämonin'],['alex-zaehmerin','Drachenzähmerin']]],['Elijah',[['elijah-frank','Frankenstein'],['elijah-vampir','Vampir'],['elijah-mumie','Mumie'],['elijah-scientist','Mad Scientist'],['elijah-cyber','Cyber-Zombie']]],['Kilian',[['kilian-golem','Golem'],['kilian-zombie','Zombie'],['kilian-pose','Bizeps-Pose'],['kilian-draugr','Wikinger-Draugr']]],['Siggi',[['siggi-reaper','Sensenmann'],['siggi-wolf','Werwolf'],['siggi-kuerbis','Kürbiskönig'],['siggi-zaehmer','Drachenzähmer']]],['Vincenza',[['vincenza-geist','Geister-Empfangsdame']]],['Roland',[['roland-waechter','Friedhofswärter'],['roland-saege','Kettensäge'],['roland-geist','Poltergeist'],['roland-ritter','Untoter Ritter'],['roland-rabe','Rabenlord']]]];
var add=[["Einzelne Figuren wählen (nur Seite „Training“) – je Figur Verwandlung und Jumpscare"]];
P.forEach(function(p){p[1].forEach(function(v){add.push(['tv:'+v[0],p[0]+' – '+v[1]+' (Verwandlung)','Blitz, '+v[1]+' auf dem Foto, Blitz, zurück',3]);add.push(['sc_one_'+v[0],p[0]+' – '+v[1]+' (Jumpscare)','Freigestellte Figur springt groß ins Bild'])})});
L.push.apply(L,add)})();
var f=document.getElementById('f'),page=document.getElementById('page'),day=document.getElementById('day'),now=document.getElementById('now'),list=document.getElementById('list'),run=0;
function url(){return '../'+page.value+'/show.html?hw=1&hold=1&manual=1'+(day.value?'&hwday='+day.value:'')+'&_='+Date.now()}
function load(){f.src=url()}
page.onchange=day.onchange=load;load();
var rows={};
L.forEach(function(x){if(x.length===1){var h=document.createElement('div');h.className='grp';h.textContent=x[0];list.appendChild(h);return}
 var r=document.createElement('div');r.className='row';rows[x[0]]=r;
 var fxp=x[0]==='tear'?'claws':x[0]==='crumble'?'dust':x[0];
 r.innerHTML='<div><b></b><span></span></div><button class="go">▶ Abspielen</button><code></code>';
 r.querySelector('b').textContent=x[1];r.querySelector('span').textContent=x[2];
 r.querySelector('code').textContent=x[0].indexOf('tv:')===0?'(nur auf der Testseite)':x[0].indexOf('sc_')===0?'?hw=1&scare='+x[0].slice(3):'?hw=1&fx='+fxp+(x[0]==='rain'?'&hwday=31':'');
 if(x[0].indexOf('info')===0){r.querySelector('.go').remove();r.querySelector('code').textContent=''}else r.querySelector('.go').onclick=function(){run++;play(x)};list.appendChild(r)});
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function W(){return f.contentWindow}
async function prep(x){var w=W();if(!w||!w.show)return;var want=x[3];if(want===undefined)return;if(w.idx!==want){w.show(want);await sleep(1400)}}
async function play(x){var w=W();if(!w||!w.hwPlay){now.textContent='Vorschau lädt noch …';return 0}
 await prep(x);now.textContent='Läuft: '+x[1];Object.values(rows).forEach(function(r){r.classList.remove('act')});rows[x[0]].classList.add('act');
 if(x[0].indexOf('tv:')===0){if(!w.hwTransOne){now.textContent='Nur auf der Seite Training';return 0}return w.hwTransOne(x[0].slice(3))||1500}
 if(x[0].indexOf('trans')===0){if(!w.hwTrans){now.textContent='Nur auf der Seite Training';return 0}return w.hwTrans()}
 var d=w.hwPlay(x[0])||1500;return d}
document.getElementById('all').onclick=async function(){var my=++run;f.src=url();await sleep(2500);
 for(var i=0;i<L.length;i++){var x=L[i];if(x.length===1||x[0].indexOf('info')===0)continue;if(my!==run)return;var d=await play(x);await sleep(Math.min(d,14000)+1300)}
 if(my===run){now.textContent='Fertig.';Object.values(rows).forEach(function(r){r.classList.remove('act')})}};
document.getElementById('stop').onclick=function(){run++;now.textContent='Gestoppt.';load()};
document.getElementById('next').onclick=function(){var w=W();if(w&&w.show)w.show(w.idx+1)};
document.getElementById('prev').onclick=function(){var w=W();if(w&&w.show)w.show(w.idx-1)};
</script></body></html>
