<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bonaVITA Info-TV Physio</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}</style>
</head><body>
<!-- Hülle: bleibt im Vollbild, die eigentliche Präsentation (show.html) aktualisiert sich darin selbst -->
<iframe id="f" allow="fullscreen; autoplay" title="Info-TV"></iframe>
<script>
document.getElementById('f').src='show.html'+location.search;
function fs(){var d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;try{if(f&&!document.fullscreenElement){var r=f.call(d);if(r&&r.catch)r.catch(function(){})}}catch(x){}}
addEventListener('click',fs);addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)fs()});
// Hülle selbst bei Änderung neu laden (selten nötig)
(function(){var last=null;function chk(){fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){if(last!==null&&t!==last)location.reload();last=t}).catch(function(){})}chk();setInterval(chk,600000)})();
</script></body></html>
